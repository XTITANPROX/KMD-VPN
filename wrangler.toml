name = "kalfetela"
main = "src/index.ts"
compatibility_date = "2026-10-16"
compatibility_flags = [ "nodejs_compat" ]

# -------- D1 database --------
# Create with:  wrangler d1 create kalfetela
[[d1_databases]]
binding = "DB"
database_name = "kalfetela"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"

# -------- Durable Objects (SQLite-backed for free plan) --------
[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserState", "PoolState", "RateLimiter"]

[durable_objects]
bindings = [
  { name = "USER_STATE", class_name = "UserState" },
  { name = "POOL_STATE",  class_name = "PoolState"  },
  { name = "RATE_LIMIT",  class_name = "RateLimiter" }
]

# -------- KV namespaces (caches) --------
# Create with:  wrangler kv namespace create KALFETELA_KV
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"

# -------- R2 bucket is OPTIONAL (paid plan). Uncomment to enable.
# Create with:  wrangler r2 bucket create kalfetela-data
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "kalfetela-data"

# -------- Analytics Engine (optional; requires enabling in dashboard) --------
# [[analytics_engine_datasets]]
# binding = "METRICS"
# dataset = "kalfetela_metrics"

# -------- Queues (batched writes) --------
# Create with:  wrangler queues create kalfetela-writes
[[queues.producers]]
binding = "WRITE_QUEUE"
queue = "kalfetela-writes"

[[queues.consumers]]
queue = "kalfetela-writes"
max_batch_size = 100
max_batch_timeout = 5
max_retries = 3

# -------- Scheduled (cron) --------
[triggers]
crons = ["* * * * *", "*/5 * * * *", "0 * * * *"]

# -------- Secrets (set via wrangler secret put) --------
# PANEL_SECRET      - 32+ char random master secret (HMAC + session signing)

[vars]
APP_NAME = "KALFETELA"
APP_VERSION = "1.0.0"
PRIMARY_FETCH = "https://raw.githubusercontent.com/panel-zeus/Z-E-U-S/main/ips.txt"
DEFAULT_DOH = "https://cloudflare-dns.com/dns-query"
PROXY_FALLBACK_HOSTS = "fra,ams,lhr,cdg,fra2"

[observability]
enabled = true
